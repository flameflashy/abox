apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-retrieval-corpus
  namespace: kagent
  annotations:
    kustomize.toolkit.fluxcd.io/reconcile: disabled
  labels:
    app.kubernetes.io/part-of: lab4-agentic-retrieval
data:
  DOC-01-qdrant-storage.yaml: |
    apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: qdrant
      namespace: qdrant
    spec:
      serviceName: qdrant
      template:
        spec:
          containers:
            - name: qdrant
              image: qdrant/qdrant:v1.19.1
              volumeMounts:
                - name: qdrant-storage
                  mountPath: /qdrant/storage
      volumeClaimTemplates:
        - metadata:
            name: qdrant-storage
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 5Gi
  DOC-02-sidecar-network.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: document-api
      namespace: retrieval
    spec:
      containers:
        - name: application
          image: example/document-api:1.0
          env:
            - name: EMBEDDINGS_URL
              value: http://127.0.0.1:8090/v1/embeddings
        - name: embeddings-sidecar
          image: example/llama-cpp-embeddings:1.0
          ports:
            - containerPort: 8090
    # Containers in the same Pod share one network namespace and communicate
    # through localhost.
  DOC-03-flux-oci.yaml: |
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: releases
      namespace: flux-system
    spec:
      interval: 2m
      url: oci://ghcr.io/den-vasyliev/abox/releases-llmd-embeddings
      ref:
        tag: 0.9.5
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: releases
      namespace: flux-system
    spec:
      interval: 2m
      sourceRef:
        kind: OCIRepository
        name: releases
      path: ./
      prune: true
      wait: true
  DOC-04-llmd-route.yaml: |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: llm-d-embedding
      namespace: llm-d
    spec:
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /llmd/v1/embeddings
          filters:
            - type: URLRewrite
              urlRewrite:
                path:
                  type: ReplacePrefixMatch
                  replacePrefixMatch: /v1/embeddings
          backendRefs:
            - name: llm-d-embedding
              port: 8000
    # This exact route targets the decode Service directly. The catch-all
    # /llmd route is the one that targets the InferencePool.
  DOC-05-official-qdrant-mcp.yaml: |
    apiVersion: kagent.dev/v1alpha1
    kind: MCPServer
    metadata:
      name: qdrant-official-mcp
      namespace: kagent
    spec:
      transportType: stdio
      deployment:
        cmd: uvx
        env:
          QDRANT_URL: http://qdrant.qdrant:6333
          COLLECTION_NAME: lab4-minilm
          EMBEDDING_PROVIDER: fastembed
          EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
    # The official server exposes qdrant-store and qdrant-find.
  DOC-06-agent-model.yaml: |
    apiVersion: kagent.dev/v1alpha2
    kind: Agent
    metadata:
      name: retrieval-agent
      namespace: kagent
    spec:
      type: Declarative
      declarative:
        modelConfig: default-model-config
        tools:
          - type: McpServer
            mcpServer:
              name: qdrant-official-mcp
              toolNames: [qdrant-store, qdrant-find]
          - type: Agent
            agent:
              name: k8s-agent
              namespace: kagent
    # ModelConfig selects the reasoning/chat model. It is independent from the
    # embedding model used by the MCP server.
  DOC-07-abox-qdrant-mcp.yaml: |
    apiVersion: kagent.dev/v1alpha1
    kind: MCPServer
    metadata:
      name: qdrant-mcp
      namespace: kagent
    spec:
      deployment:
        image: ghcr.io/den-vasyliev/abox/qdrant-mcp:0.4.0
        env:
          EMBEDDINGS_BASE_URL: http://llama-cpp-embeddings.llama-cpp:8090
          QDRANT_URL: http://qdrant.qdrant:6333
          QDRANT_COLLECTION: abox-nomic
    # The Abox server exposes vector_store and vector_find and obtains
    # 768-dimensional Nomic embeddings from an external llama.cpp endpoint.
  DOC-08-inference-pool.yaml: |
    apiVersion: inference.networking.k8s.io/v1
    kind: InferencePool
    metadata:
      name: llm-d-pool
      namespace: llm-d
    spec:
      targetPorts:
        - number: 8000
      selector:
        llm-d.ai/inferenceServing: "true"
      endpointPickerRef:
        name: llm-d-pool-epp
        port:
          number: 9002
    # The endpoint picker chooses among matching inference-serving Pods. With
    # one decode replica there is only one candidate.
